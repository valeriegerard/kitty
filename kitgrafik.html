<title>Kit Grafik</title>
<style>
/* ============ FONTS ============ */
@font-face{
  font-family:"DIN Pro HEAJ";
  src:url(data:font/otf;base64,__FONT_B64__) format("opentype");
  font-weight:700;
  font-style:normal;
  font-display:swap;
}
@import url('https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&display=swap');

/* ============ DESIGN TOKENS ============ */
:root{
  --paper:#FFFFFF;
  --paper-warm:#FBF8F2;
  --surface-sunken:#F4F0E6;
  --ink:#181A1E;
  --ink-soft:#5C5F66;
  --ink-faint:#8A8D93;
  --line:#E7E1D3;
  --line-soft:#F1ECDF;
  --focus-ring:#21599C;

  --crimson:#C9245A;
  --coral:#E8404A;
  --orange:#ED6B47;
  --amber:#FAB531;
  --yellow:#EFE21A;
  --emerald:#38B587;
  --sky:#35B2E6;
  --navy:#21599C;
  --violet:#7F73BC;
  --pink:#F492BB;

  --c-logos:var(--crimson);
  --c-typos:var(--amber);
  --c-couleurs:var(--pink);
  --c-pictogrammes:var(--emerald);
  --c-qrcodes:var(--orange);
  --c-photos:var(--coral);
  --c-motifs:var(--sky);
  --c-gabarits:var(--navy);
  --c-charte:var(--violet);

  --good:#2E9E5B;
  --warn:#C67C1E;
  --crit:#D33E3E;

  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:18px;
  --radius-pill:999px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px; --sp-7:48px; --sp-8:64px; --sp-9:96px;

  --shadow-sm:0 1px 2px rgba(24,26,30,.06), 0 1px 1px rgba(24,26,30,.04);
  --shadow-md:0 6px 20px rgba(24,26,30,.10), 0 2px 6px rgba(24,26,30,.06);
  --shadow-lg:0 20px 48px rgba(24,26,30,.16), 0 6px 16px rgba(24,26,30,.08);

  --font-display:"DIN Pro HEAJ", "Arial Narrow", sans-serif;
  --font-body:"Barlow", "Helvetica Neue", Arial, sans-serif;
}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17181B;
    --paper-warm:#1D1E22;
    --surface-sunken:#222327;
    --ink:#F3F1EA;
    --ink-soft:#B7B9BF;
    --ink-faint:#82858C;
    --line:#33343A;
    --line-soft:#2A2B30;
    --shadow-sm:0 1px 2px rgba(0,0,0,.5);
    --shadow-md:0 6px 20px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
    --shadow-lg:0 20px 48px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --paper:#17181B;
  --paper-warm:#1D1E22;
  --surface-sunken:#222327;
  --ink:#F3F1EA;
  --ink-soft:#B7B9BF;
  --ink-faint:#82858C;
  --line:#33343A;
  --line-soft:#2A2B30;
  --shadow-sm:0 1px 2px rgba(0,0,0,.5);
  --shadow-md:0 6px 20px rgba(0,0,0,.5), 0 2px 6px rgba(0,0,0,.3);
  --shadow-lg:0 20px 48px rgba(0,0,0,.6), 0 6px 16px rgba(0,0,0,.4);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  padding-inline:0;
}
img,svg{max-width:100%;display:block;}
a{color:inherit;}
button{font-family:inherit;}
h1,h2,h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.01em;text-wrap:balance;margin:0;}
::selection{background:var(--amber);color:var(--ink);}

.eyebrow{
  font-family:var(--font-body);
  font-weight:700;
  font-size:11px;
  letter-spacing:.10em;
  text-transform:uppercase;
  color:var(--ink-faint);
}

/* focus ring */
:focus-visible{
  outline:2.5px solid var(--focus-ring);
  outline-offset:2px;
  border-radius:4px;
}
button:focus-visible, a:focus-visible, input:focus-visible, [tabindex]:focus-visible{
  outline:2.5px solid var(--focus-ring);
  outline-offset:2px;
}

/* ============ SHELL ============ */
.shell{max-width:1360px;margin:0 auto;padding-inline:24px;}
@media (max-width:640px){ .shell{padding-inline:16px;} }

.topbar{
  position:sticky; top:env(safe-area-inset-top,0px); z-index:40;
  background:var(--paper);
  border-bottom:1px solid var(--line);
}
.topbar-inner{
  display:flex; align-items:center; gap:20px;
  height:72px;
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;flex-shrink:0;cursor:pointer;}
.brand-mark{height:34px;width:34px;flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-size:19px;letter-spacing:.01em;line-height:1;}
.brand-domain{font-size:11px;color:var(--ink-faint);letter-spacing:.04em;margin-top:2px;}

.search{
  flex:1; max-width:440px; position:relative;
}
.search input{
  width:100%; height:42px; border-radius:var(--radius-pill);
  border:1.5px solid var(--line); background:var(--paper-warm);
  padding:0 16px 0 40px; font-size:14px; color:var(--ink); font-family:var(--font-body);
}
.search input::placeholder{color:var(--ink-faint);}
.search input:focus-visible{outline:2.5px solid var(--focus-ring);outline-offset:1px;border-color:var(--focus-ring);}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--ink-faint);pointer-events:none;}

.topbar-actions{display:flex;align-items:center;gap:10px;margin-left:auto;flex-shrink:0;}
#themeToggle{display:none;}
.topbar-actions .mode-switch{display:none;}
.mode-switch{
  display:flex; background:var(--surface-sunken); border-radius:var(--radius-pill); padding:3px; gap:2px;
}
.mode-switch button{
  border:0; background:transparent; padding:7px 14px; border-radius:var(--radius-pill);
  font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:background .15s,color .15s;
  display:flex;align-items:center;gap:6px;
}
.mode-switch button.active{background:var(--paper);color:var(--ink);box-shadow:var(--shadow-sm);}
.mode-switch button:hover:not(.active){color:var(--ink);}

.icon-btn{
  width:40px;height:40px;border-radius:var(--radius-pill);border:1.5px solid var(--line);
  background:var(--paper); display:flex;align-items:center;justify-content:center;cursor:pointer;
  color:var(--ink-soft); transition:border-color .15s,color .15s,background .15s;
  flex-shrink:0;
}
.icon-btn:hover{border-color:var(--ink-faint);color:var(--ink);background:var(--paper-warm);}
.icon-btn svg{width:18px;height:18px;}

.btn.btn-share{height:40px;padding:0 16px;gap:8px;border-radius:var(--radius-pill);}
@media (max-width:640px){ .btn.btn-share{width:40px;padding:0;justify-content:center;} .btn-share-label{display:none;} }
.menu-toggle{display:none;}
@media (max-width:860px){
  .search{display:none;}
  .search-standalone{display:block;}
  .menu-toggle{display:flex;}
  .brand-domain{display:none;}
}

/* ============ BUTTONS ============ */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border-radius:var(--radius-md); font-weight:600; font-size:14px; cursor:pointer;
  border:1.5px solid transparent; padding:10px 18px; font-family:var(--font-body);
  transition:transform .12s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  white-space:nowrap;
}
.btn svg{width:16px;height:16px;flex-shrink:0;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--ink);color:var(--paper);}
.btn-primary:hover{background:#000;box-shadow:var(--shadow-sm);}
:root[data-theme="dark"] .btn-primary, @media (prefers-color-scheme:dark){ .btn-primary{background:var(--ink);color:var(--paper-warm);} }
.btn-secondary{background:var(--paper);border-color:var(--line);color:var(--ink);}
.btn-secondary:hover{border-color:var(--ink-faint);background:var(--paper-warm);}
.btn-ghost{background:transparent;color:var(--ink-soft);}
.btn-ghost:hover{color:var(--ink);background:var(--surface-sunken);}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:var(--radius-sm);}
.btn[disabled]{opacity:.45;cursor:not-allowed;pointer-events:none;}
.btn-block{width:100%;}

/* ============ LAYOUT: sidebar + main ============ */
.layout{display:grid;grid-template-columns:248px 1fr;gap:0;align-items:start;}
@media (max-width:860px){ .layout{grid-template-columns:1fr;} }

.sidebar{
  position:sticky; top:calc(72px + env(safe-area-inset-top,0px)); align-self:start;
  padding:28px 20px 40px 0; height:calc(100vh - 72px); overflow-y:auto;
}
@media (max-width:860px){
  .sidebar{position:static;height:auto;padding:14px 0;overflow:visible;}
}

.folder-nav{display:flex;flex-direction:column;gap:2px;}
.folder-item{display:flex;flex-direction:column;}
.folder-link{
  display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-md);
  text-decoration:none;color:var(--ink-soft);font-size:14px;font-weight:600;cursor:pointer;
  border:1.5px solid transparent;
  transition:background .12s,color .12s;
}
.folder-link:hover{background:var(--surface-sunken);color:var(--ink);}
.folder-link.active{background:var(--surface-sunken);color:var(--ink);}
.folder-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.folder-count{margin-left:auto;font-size:12px;color:var(--ink-faint);font-variant-numeric:tabular-nums;}
.folder-children{display:flex;flex-direction:column;gap:1px;padding-left:27px;margin:2px 0 8px;}
.folder-children.collapsed{display:none;}
.sub-link{
  display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:var(--radius-sm);
  text-decoration:none;color:var(--ink-faint);font-size:13px;font-weight:500;cursor:pointer;border:1.5px solid transparent;
}
.sub-link:hover{background:var(--surface-sunken);color:var(--ink);}
.sub-link.active{color:var(--ink);background:var(--surface-sunken);font-weight:600;}

.sidebar-divider{height:1px;background:var(--line);margin:16px 0;}

/* mobile folder chips */
.chip-row{display:none;gap:8px;overflow-x:auto;padding:14px 0 4px;-webkit-overflow-scrolling:touch;}
.chip-row::-webkit-scrollbar{display:none;}
@media (max-width:860px){ .chip-row{display:flex;} .sidebar-full{display:none;} }
.chip{
  flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--radius-pill);
  background:var(--surface-sunken);border:1.5px solid transparent;font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer; white-space:nowrap;
}
.chip.active{background:var(--ink);color:var(--paper);}

/* ============ MAIN CONTENT ============ */
.main{padding:28px 0 96px;min-width:0;}
.breadcrumb{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-faint);margin-bottom:14px;flex-wrap:wrap;}
.breadcrumb a{text-decoration:none;color:var(--ink-faint);}
.breadcrumb a:hover{color:var(--ink);text-decoration:underline;}
.breadcrumb .sep{opacity:.5;}
.breadcrumb .crumb-home{display:inline-flex;align-items:center;gap:6px;}
.breadcrumb .current{color:var(--ink);font-weight:600;}

.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-bottom:22px;flex-wrap:wrap;}
.section-head h1{font-size:34px;line-height:1.05;}
.section-desc{color:var(--ink-soft);font-size:14.5px;max-width:56ch;margin-top:8px;line-height:1.55;}
.section-count{font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tools-row{display:flex;gap:10px;flex-wrap:wrap;}

.toolbar{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:22px;
  padding-bottom:18px;border-bottom:1px solid var(--line);
}
.filter-chip{
  display:flex;align-items:center;gap:6px;padding:7px 13px;border-radius:var(--radius-pill);
  border:1.5px solid var(--line);background:var(--paper);font-size:13px;font-weight:600;color:var(--ink-soft);
  cursor:pointer;transition:border-color .12s,color .12s,background .12s;
}
.filter-chip:hover{border-color:var(--ink-faint);color:var(--ink);}
.filter-chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
.toolbar-spacer{flex:1;}
.view-toggle{display:flex;border:1.5px solid var(--line);border-radius:var(--radius-md);overflow:hidden;}
.view-toggle button{
  width:36px;height:34px;border:0;background:var(--paper);color:var(--ink-faint);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.view-toggle button+button{border-left:1.5px solid var(--line);}
.view-toggle button.active{background:var(--surface-sunken);color:var(--ink);}
.view-toggle svg{width:16px;height:16px;}

/* ============ CARDS ============ */
.grid{
  display:grid; gap:18px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
}
.card{
  background:var(--paper); border:1.5px solid var(--line); border-radius:var(--radius-lg);
  overflow:hidden; cursor:pointer; text-align:left; padding:0; display:flex; flex-direction:column;
  transition:border-color .15s ease, box-shadow .15s ease, transform .15s ease;
  position:relative;
}
.card:hover{border-color:var(--ink-faint);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.card:focus-visible{outline:2.5px solid var(--focus-ring);outline-offset:2px;}
.card-thumb{
  aspect-ratio:4/3; background:var(--paper-warm); display:flex;align-items:center;justify-content:center;
  padding:22px; position:relative; border-bottom:1px solid var(--line);
}
.card-thumb svg,.card-thumb img{max-height:100%;max-width:100%;object-fit:contain;}
.card-thumb.dark-thumb{background:var(--ink);}
.mono-stage{background:var(--ink);border-radius:var(--radius-md);padding:30px 42px;display:flex;align-items:center;justify-content:center;width:100%;}
.mono-stage .logo-preview-svg{width:100%;max-width:380px;height:auto;max-height:160px;}
.card-edge{position:absolute;top:0;left:0;right:0;height:4px;}
.card-quickdl{
  position:absolute; top:10px; right:10px; width:32px;height:32px;border-radius:50%;
  background:var(--paper); border:1.5px solid var(--line); display:flex;align-items:center;justify-content:center;
  color:var(--ink-soft); opacity:0; transform:translateY(-4px); transition:opacity .12s,transform .12s,color .12s,border-color .12s;
}
.card:hover .card-quickdl,.card:focus-visible .card-quickdl{opacity:1;transform:none;}
.card-quickdl:hover{color:var(--ink);border-color:var(--ink-faint);}
.card-quickdl svg{width:15px;height:15px;}
.card-body{padding:14px 15px 16px;display:flex;flex-direction:column;gap:7px;flex:1;}
.card-title{font-size:14.5px;font-weight:700;line-height:1.3;color:var(--ink);}
.card-meta{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink-faint);flex-wrap:wrap;font-variant-numeric:tabular-nums;}
.type-badge{
  font-size:10.5px;font-weight:800;letter-spacing:.04em;padding:2.5px 7px;border-radius:5px;
  background:var(--surface-sunken);color:var(--ink-soft);text-transform:uppercase;
}
.card-tags{display:flex;gap:6px;margin-top:2px;flex-wrap:wrap;}
.folder-tag{
  font-size:11px;font-weight:600;padding:3px 9px;border-radius:var(--radius-pill);display:inline-flex;align-items:center;gap:5px;
}

/* skeleton */
.skeleton{position:relative;overflow:hidden;background:var(--surface-sunken);}
.skeleton::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.5),transparent);
  transform:translateX(-100%); animation:shimmer 1.4s infinite;
}
:root[data-theme="dark"] .skeleton::after, @media (prefers-color-scheme:dark){.skeleton::after{background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}}
@keyframes shimmer{100%{transform:translateX(100%);}}
.sk-card{border-radius:var(--radius-lg);border:1.5px solid var(--line);overflow:hidden;}
.sk-thumb{aspect-ratio:4/3;}
.sk-line{height:11px;border-radius:4px;margin:14px 15px;}
.sk-line.w60{width:60%;}
.sk-line.w40{width:40%;margin-top:0;}
@media (prefers-reduced-motion:reduce){ .skeleton::after{animation:none;} }

/* empty & error states */
.state-block{
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:64px 24px;border:1.5px dashed var(--line);border-radius:var(--radius-lg);gap:14px;color:var(--ink-soft);
}
.state-block .state-icon{
  width:52px;height:52px;border-radius:50%;background:var(--surface-sunken);display:flex;align-items:center;justify-content:center;color:var(--ink-faint);
}
.state-block .state-icon svg{width:24px;height:24px;}
.state-block h3{font-family:var(--font-body);text-transform:none;font-size:16px;font-weight:700;color:var(--ink);letter-spacing:0;}
.state-block p{margin:0;font-size:13.5px;max-width:38ch;line-height:1.5;}
.state-block.state-error .state-icon{background:color-mix(in srgb, var(--crit) 15%, var(--paper));color:var(--crit);}

/* toast */
.toast-stack{position:fixed;bottom:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px;}
@media (max-width:640px){ .toast-stack{left:16px;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));max-width:none;} }
.toast{
  background:var(--ink);color:var(--paper-warm);padding:13px 16px;border-radius:var(--radius-md);
  box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:600;
  animation:toast-in .22s ease;
}
.toast.toast-error{background:var(--crit);color:#fff;}
.toast svg{width:17px;height:17px;flex-shrink:0;}
@keyframes toast-in{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}

/* ============ CHARTE VIEWER ============ */
.viewer{position:fixed;inset:0;z-index:120;background:#16171b;color:#fff;display:flex;flex-direction:column;opacity:0;pointer-events:none;visibility:hidden;transition:opacity .18s ease;}
.viewer.open{opacity:1;pointer-events:auto;visibility:visible;}
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top,0px));border-bottom:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.viewer-title{display:flex;align-items:baseline;gap:12px;min-width:0;}
.viewer-title-main{font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.viewer-count{font-size:13px;color:rgba(255,255,255,.65);white-space:nowrap;font-variant-numeric:tabular-nums;}
.viewer-tools{display:flex;gap:6px;flex-shrink:0;}
.viewer-btn{width:38px;height:38px;border-radius:50%;border:1.5px solid rgba(255,255,255,.22);background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;}
.viewer-btn:hover,.viewer-btn.active{background:rgba(255,255,255,.14);}
.viewer-btn:focus-visible,.viewer-nav:focus-visible{outline:2px solid #fff;outline-offset:2px;}
.viewer-btn svg{width:18px;height:18px;}
.viewer-main{position:relative;flex:1;min-height:0;display:flex;}
.viewer-stage{flex:1;min-width:0;overflow:auto;display:flex;padding:16px 64px;-webkit-overflow-scrolling:touch;}
.viewer-page{display:block;margin:auto;max-width:100%;max-height:100%;object-fit:contain;background:#fff;box-shadow:0 10px 40px rgba(0,0,0,.5);border-radius:2px;cursor:zoom-in;user-select:none;-webkit-user-drag:none;}
.viewer-stage.zoomed .viewer-page{max-width:none;max-height:none;cursor:zoom-out;}
.viewer-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;z-index:2;}
.viewer-nav:hover{background:rgba(255,255,255,.26);}
.viewer-nav:disabled{opacity:.25;cursor:default;}
.viewer-nav svg{width:22px;height:22px;}
.viewer-prev{left:10px;} .viewer-next{right:10px;}
.viewer-foot{padding:10px 20px;padding-bottom:max(10px,env(safe-area-inset-bottom,0px));border-top:1px solid rgba(255,255,255,.1);flex-shrink:0;}
.viewer-foot input[type=range]{width:100%;accent-color:#fff;display:block;}
.viewer-grid{position:absolute;inset:0;background:#16171b;overflow:auto;padding:20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px;align-content:start;z-index:3;}
.viewer-grid[hidden]{display:none;}
.viewer-thumb{border:2px solid transparent;background:none;padding:0;cursor:pointer;color:#fff;text-align:center;font:inherit;font-size:12px;border-radius:4px;}
.viewer-thumb img{display:block;width:100%;aspect-ratio:841.89/595.276;object-fit:cover;background:#fff;border-radius:2px;}
.viewer-thumb span{display:block;padding:4px 0 2px;color:rgba(255,255,255,.7);}
.viewer-thumb.current{border-color:#fff;}
@media (max-width:640px){
  .viewer-stage{padding:10px 8px;}

function fmtBytes(b){
  if(!b) return '—';
  if(b < 1024) return b+' o';
  if(b < 1024*1024) return (b/1024).toFixed(b<10240?1:0)+' Ko';
  return (b/(1024*1024)).toFixed(1)+' Mo';
}
function fileLine(f){ return f.label ? f.ext+' · '+f.label : f.ext+' · '+fmtBytes(f.bytes); }
function totalBytes(a){ return a.files.reduce((s,f)=>s+(f.bytes||0),0); }
function folderCount(slug){ return ASSETS.filter(a=>a.folder===slug).length; }
function subCount(fslug,sslug){ return ASSETS.filter(a=>a.folder===fslug && a.sub===sslug).length; }

/* ======================================================================
   STATE
   ====================================================================== */
const state = {
  mode: 'public',
  route: { type:'home' },
  q: '',
  ext: 'all',
  view: 'grid',
  loading: false,
};

function navigate(route){
  state.route = route;
  state.q=''; state.ext='all';
  const si = document.getElementById('searchInput'); if(si) si.value='';
  simulateLoadThenRender();
  window.scrollTo({top:0,behavior:'smooth'});
}
function simulateLoadThenRender(){
  state.loading = true;
  render();
  window.clearTimeout(window.__ldt);
  window.__ldt = window.setTimeout(()=>{ state.loading=false; render(); }, 420);
}
function setMode(mode){
  state.mode = mode;
  document.getElementById('btnModePublic').classList.toggle('active', mode==='public');
  document.getElementById('btnModePublic').setAttribute('aria-selected', mode==='public');
  document.getElementById('btnModeAdmin').classList.toggle('active', mode==='admin');
  document.getElementById('btnModeAdmin').setAttribute('aria-selected', mode==='admin');
  if(mode==='admin'){ state.adminTab = state.adminTab || 'dashboard'; }
  simulateLoadThenRender();
}
function toggleTheme(){
  const root = document.documentElement;
  const cur = root.getAttribute('data-theme');
  const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark':'light';
  let next;
  if(!cur) next = (sys==='dark') ? 'light' : 'dark';
  else next = (cur==='dark') ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('kg-theme', next); }catch(e){}
}
(function initTheme(){
  try{ const saved = localStorage.getItem('kg-theme'); if(saved) document.documentElement.setAttribute('data-theme', saved); }catch(e){}
})();
function toggleMobileNav(){
  const sb = document.getElementById('mobileMenuSheet');
  if(sb) sb.classList.toggle('open');
}

/* ======================================================================
   TOASTS
   ====================================================================== */
function toast(msg, kind){
  const stack = document.getElementById('toastStack');
  const el = document.createElement('div');
  el.className = 'toast' + (kind==='error' ? ' toast-error' : '');
  el.innerHTML = icon(kind==='error' ? 'alert' : 'checkcircle', 17) + '<span>'+msg+'</span>';
  stack.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transform='translateY(6px)'; el.style.transition='all .2s'; setTimeout(()=>el.remove(),200); }, 3400);
}

   THUMBNAILS
   ====================================================================== */
function accentOf(asset){ const f = folderOf(asset.folder); return f ? f.color : 'var(--ink-faint)'; }

function thumbHTML(asset){
  switch(asset.thumb){
    case 'logo-color': return '<div class="card-thumb">'+logoMark('color','logo-thumb-svg')+'</div>';

   ====================================================================== */
function currentAssetList(){
  let list = ASSETS.slice();
  const r = state.route;
  if(r.type==='folder') list = list.filter(a=>a.folder===r.slug);
  if(r.type==='subfolder') list = list.filter(a=>a.folder===r.fslug && a.sub===r.sslug);
  if(state.q){
    const q = state.q.toLowerCase();
    list = list.filter(a=> a.title.toLowerCase().includes(q) || (folderOf(a.folder)||{}).name.toLowerCase().includes(q));
  }
  if(state.ext !== 'all'){
    list = list.filter(a=> a.files.some(f=>f.ext===state.ext));
  }
  return list;
}
function extListForRoute(){
  let list = ASSETS.slice();
  const r = state.route;
  if(r.type==='folder') list = list.filter(a=>a.folder===r.slug);
  if(r.type==='subfolder') list = list.filter(a=>a.folder===r.fslug && a.sub===r.sslug);
  const set = new Set();
  list.forEach(a=>a.files.forEach(f=>set.add(f.ext)));
  return Array.from(set);
}

/* ============ CHARTE VIEWER ============ */
const CHARTE_PAGES = __CHARTE_PAGES__;
const CHARTE_THUMBS = __CHARTE_THUMBS__;
const viewerState = { i:0, zoom:1, grid:false, ready:false, touchX:null, lastFocus:null };
function initViewer(){
  if(viewerState.ready) return;
  viewerState.ready = true;
  const set = (id, name)=>{ const el=document.getElementById(id); if(el) el.innerHTML = icon(name,18); };
  set('viewerGridBtn','grid'); set('viewerDlBtn','download'); set('viewerCloseBtn','x');
  set('viewerPrev','chevronleft'); set('viewerNext','chevronright');
  const z = document.querySelectorAll('.viewer-zoom');
  if(z[0]) z[0].innerHTML = icon('zoomout',18);
  if(z[1]) z[1].innerHTML = icon('zoomin',18);
  const range = document.getElementById('viewerRange');
  range.max = CHARTE_PAGES.length;
  const img = document.getElementById('viewerImg');
  img.addEventListener('click', ()=>viewerZoomTo(viewerState.zoom>1?1:2));
  const stage = document.getElementById('viewerStage');
  stage.addEventListener('touchstart', e=>{ viewerState.touchX = (e.touches.length===1 && viewerState.zoom===1) ? e.touches[0].clientX : null; }, {passive:true});
  stage.addEventListener('touchend', e=>{
    if(viewerState.touchX==null) return;
    const dx = e.changedTouches[0].clientX - viewerState.touchX; viewerState.touchX = null;
    if(Math.abs(dx)>50) viewerGo(dx<0?1:-1);
  }, {passive:true});
  document.getElementById('viewerGrid').innerHTML = CHARTE_THUMBS.map((t,k)=>
    '<button class="viewer-thumb" data-i="'+k+'" onclick="viewerShow('+k+');toggleViewerGrid(false)" aria-label="Page '+(k+1)+'"><img src="'+t+'" alt="" loading="lazy"/><span>'+(k+1)+'</span></button>').join('');
}
function openCharteViewer(page){
  initViewer();
  closeModal();
  viewerState.lastFocus = document.activeElement;
  const v = document.getElementById('charteViewer');
  v.classList.add('open'); v.setAttribute('aria-hidden','false');
  document.body.style.overflow='hidden';
  viewerState.zoom = 1; toggleViewerGrid(false);
  viewerShow(page||0);
  const c = document.getElementById('viewerCloseBtn'); if(c) c.focus();
}
function closeCharteViewer(){
  const v = document.getElementById('charteViewer');
  if(!v.classList.contains('open')) return;
  v.classList.remove('open'); v.setAttribute('aria-hidden','true');
  document.body.style.overflow='';
  const lf = viewerState.lastFocus; if(lf && lf.focus) { try{ lf.focus(); }catch(e){} }
}
function viewerIsOpen(){ const v=document.getElementById('charteViewer'); return !!v && v.classList.contains('open'); }
function viewerShow(i){
  const n = CHARTE_PAGES.length;
  i = Math.max(0, Math.min(n-1, i));
  viewerState.i = i;
  const img = document.getElementById('viewerImg');
  img.src = CHARTE_PAGES[i];
  img.alt = 'Charte graphique HEAJ — page '+(i+1)+' sur '+n;
  document.getElementById('viewerCount').textContent = 'Page '+(i+1)+' / '+n;
  document.getElementById('viewerRange').value = i+1;
  document.getElementById('viewerPrev').disabled = i===0;
  document.getElementById('viewerNext').disabled = i===n-1;
  const stage = document.getElementById('viewerStage');
  stage.scrollTop = 0; stage.scrollLeft = 0;
  document.querySelectorAll('.viewer-thumb').forEach(b=>b.classList.toggle('current', +b.dataset.i===i));
}
function viewerGo(d){ viewerShow(viewerState.i + d); }
function viewerZoomTo(z){
  z = Math.max(1, Math.min(3, z));
  viewerState.zoom = z;
  const stage = document.getElementById('viewerStage');
  const img = document.getElementById('viewerImg');
  stage.classList.toggle('zoomed', z>1);
  if(z>1){ img.style.width = (z*100)+'%'; img.style.height='auto'; }
  else { img.style.width=''; img.style.height=''; }
}
function viewerZoom(delta){ viewerZoomTo(viewerState.zoom + delta); }
function toggleViewerGrid(force){
  const g = document.getElementById('viewerGrid');
  const show = typeof force==='boolean' ? force : g.hidden;
  g.hidden = !show;
  const b = document.getElementById('viewerGridBtn'); if(b) b.classList.toggle('active', show);
  if(show){ const cur = g.querySelector('.viewer-thumb.current'); if(cur) cur.scrollIntoView({block:'center'}); }
}
document.addEventListener('keydown', e=>{
  if(!viewerIsOpen()) return;
  if(e.key==='Escape'){ if(!document.getElementById('viewerGrid').hidden) toggleViewerGrid(false); else closeCharteViewer(); }
  else if(e.key==='ArrowRight'||e.key==='PageDown') { e.preventDefault(); viewerGo(1); }
  else if(e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); viewerGo(-1); }
  else if(e.key==='Home'){ viewerShow(0); }
  else if(e.key==='End'){ viewerShow(CHARTE_PAGES.length-1); }
  else if(e.key==='+'||e.key==='='){ viewerZoom(0.5); }
  else if(e.key==='-'){ viewerZoom(-0.5); }
  else if(e.key==='g'||e.key==='G'){ toggleViewerGrid(); }
});

function shareKit(){
  const url = location.href.split('#')[0];
  const data = { title:'Kit Grafik — HEAJ', text:'Ressources graphiques de la HEAJ : charte, logos, typos, couleurs et modèles.', url:url };
  const copyFallback = ()=>{
    const done = ()=>toast('Lien copié — vous pouvez le coller dans un e-mail ou un message.');
    const legacy = ()=>{
      try{
        const ta=document.createElement('textarea'); ta.value=url; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); const ok=document.execCommand('copy'); document.body.removeChild(ta);
        if(ok) done(); else toast('Copie impossible — lien : '+url, 'error');
      }catch(e){ toast('Copie impossible — lien : '+url, 'error'); }
    };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(url).then(done, legacy); }
    else legacy();
  };
  if(navigator.share){
    navigator.share(data).catch(err=>{ if(err && err.name==='AbortError') return; copyFallback(); });
  } else { copyFallback(); }
}

  state.q = val;

  if(si && si.value!==val) si.value = val;
  if(state.route.type==='home' && state.q){ state.route = {type:'folder', slug:'logos'}; render(); }
  else { renderPublicContent(); }
}

  render();
});
